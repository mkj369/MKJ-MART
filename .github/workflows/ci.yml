name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit/integration, build, E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mkj_e2e
      NEXT_TELEMETRY_DISABLED: 1
      # Storage tests run against MinIO, which verifies AWS Signature V4 (s3rver does not).
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Start MinIO (S3-compatible object storage)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:latest server /data
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/mkj-media"
      - name: Unit & integration tests (real PostgreSQL, SMTP, S3)
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + mobile, axe accessibility)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  production-stack:
    name: Docker image + production stack smoke test
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml --env-file .env.production
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint < Dockerfile
      - name: Lint deploy scripts (shellcheck)
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable -s sh deploy/backup.sh deploy/restore.sh deploy/scheduler.sh
      - name: Validate Caddyfile
        run: >-
          docker run --rm -e DOMAIN=shop.example.com -e ACME_EMAIL=ops@example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Prepare a production env file (localhost → Caddy's internal CA)
        run: |
          cp .env.production.example .env.production
          sed -i "s|^DOMAIN=.*|DOMAIN=localhost|; s|^APP_URL=.*|APP_URL=https://localhost|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|; s|^CRON_SECRET=.*|CRON_SECRET=$(openssl rand -hex 24)|" .env.production
      - name: Validate compose file
        run: $COMPOSE config --quiet
      - name: Build images (runner + tools)
        run: $COMPOSE build
      - name: Start the stack (db → migrate → app → caddy, scheduler, backup)
        run: $COMPOSE up -d --wait --wait-timeout 300 caddy app scheduler backup
      - name: Create the first administrator (password via stdin)
        run: printf '%s' 'Ci-Admin-Passw0rd-2026' | $COMPOSE run --rm -T migrate npm run -s admin:create -- --email owner@ci.test --password-stdin
      - name: Smoke test over HTTPS through Caddy
        run: |
          set -e
          curl -fsSk https://localhost/api/v1/health
          curl -fsSk -o /dev/null -D - https://localhost/ | tee /tmp/headers | grep -i '^strict-transport-security'
          grep -i '^content-security-policy' /tmp/headers
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/cron/expire-payments)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
          curl -fsSk -X POST -H 'content-type: application/json' -H 'origin: https://localhost' -H 'sec-fetch-site: same-origin' \
            -d '{"email":"owner@ci.test","password":"Ci-Admin-Passw0rd-2026"}' https://localhost/api/v1/admin/auth/login -D - -o /dev/null | grep -i 'set-cookie: mkj_session=.*secure'
      - name: Backups are written and readable
        run: |
          sleep 5
          ls -la backups
          ls backups/db-*.dump
          $COMPOSE exec -T db sh -c 'cat > /tmp/check.dump' < "$(ls backups/db-*.dump | head -1)"
          $COMPOSE exec -T db pg_restore --list /tmp/check.dump | head -5
      - name: Scheduler reached the cron endpoints
        run: |
          sleep 65
          $COMPOSE exec -T db psql -U mkj -d mkj_mart -c "select name, run_count, last_succeeded_at from job_runs order by name"
          test "$($COMPOSE exec -T db psql -U mkj -d mkj_mart -tAc "select count(*) from job_runs where last_succeeded_at is not null")" -ge 2
      - name: Logs
        if: always()
        run: $COMPOSE logs --no-color --tail 200
